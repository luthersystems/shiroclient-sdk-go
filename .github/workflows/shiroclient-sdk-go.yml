name: CI Tests
on:
  pull_request:
    branches:
      - main
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      # `golangci-lint run` does not reject an unknown key in .golangci.yml (a
      # misspelled section runs to "0 issues"); only the schema check does.
      # v2.13 embeds the schema, so this needs no network.
      - name: golangci-lint config schema
        run: golangci-lint config verify
      - name: Run CI tests
        run: make citest
  # Known-vulnerability gate: call-graph-aware, fails only on vulns whose
  # vulnerable code this module actually reaches.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
