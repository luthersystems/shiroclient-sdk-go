name: CI Tests
on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's go line is the one statement of the Go version, so a
          # dependency update that raises it cannot leave CI behind.
          go-version-file: go.mod
          cache: false
      # golangci-lint itself runs in the shared Quality workflow
      # (.github/workflows/quality.yml). `golangci-lint run` does not reject
      # an unknown key in .golangci.yml (a misspelled section runs to "0
      # issues"); only the schema check does, and the shared workflow does not
      # run it yet, so it stays here. Keep the version equal to the shared
      # workflow's pin.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint config schema
        run: golangci-lint config verify
      - name: Run CI tests
        run: make citest
  # No govulncheck job here: the shared Security workflow
  # (.github/workflows/security.yml, from luthersystems/.github) runs it on
  # every PR and push with a pinned govulncheck and an exemptions file, and
  # its "security / result" check replaces this job's. See
  # https://github.com/luthersystems/.github/blob/main/docs/security-workflow.md
  # No work marker job either: the shared Quality workflow runs the gate.
